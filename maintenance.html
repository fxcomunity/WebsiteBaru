<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Sedang Maintenance - FX Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Animated Background Particles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: white;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: white;
            bottom: -200px;
            right: -200px;
            animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(50px, -50px); }
            50% { transform: translate(-30px, 30px); }
            75% { transform: translate(40px, 20px); }
        }

        /* Main Container */
        .maintenance-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
            padding: 48px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin: auto;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Icon Animation */
        .maintenance-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.4);
            animation: bounce 3s infinite ease-in-out;
            position: relative;
        }

        .maintenance-icon::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.3;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 0; }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-15px) rotate(-5deg);
            }
            75% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        .maintenance-icon i {
            font-size: 52px;
            color: white;
            animation: spin 8s linear infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Typography */
        h1 {
            font-family: 'Poppins', sans-serif;
            color: #2d3748;
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.2;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .maintenance-text {
            color: #4a5568;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* Status Card */
        .status-info {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-left: 4px solid #667eea;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 32px;
            text-align: left;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.1);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .status-row i {
            color: #667eea;
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .status-row strong {
            color: #2d3748;
            font-weight: 600;
            min-width: 120px;
        }

        /* Code Info Section */
        .code-info {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(5, 150, 105, 0.1) 100%);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            animation: slideIn 0.8s ease 0.2s backwards;
            display: none;
        }

        .code-info p {
            color: #059669;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0;
        }

        .code-info i {
            font-size: 18px;
        }

        /* Access Form */
        .access-form {
            background: rgba(248, 250, 252, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            padding: 28px;
            margin-top: 32px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            animation: slideIn 0.8s ease 0.3s backwards;
        }

        .form-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .form-header i {
            color: #667eea;
            font-size: 20px;
        }

        .form-header h3 {
            font-family: 'Poppins', sans-serif;
            color: #2d3748;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 18px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input:focus + .input-icon {
            color: #667eea;
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        /* Button */
        .maintenance-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .maintenance-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
        }

        .maintenance-btn:active {
            transform: translateY(0);
        }

        .maintenance-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #f7fafc;
        }

        /* Messages */
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #059669;
        }

        .message i {
            font-size: 16px;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin-loader 0.8s linear infinite;
        }

        @keyframes spin-loader {
            to { transform: rotate(360deg); }
        }

        /* Contact Info */
        .contact-info {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(226, 232, 240, 0.6);
            font-size: 0.9rem;
            color: #64748b;
        }

        .contact-info a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .contact-info a:hover {
            color: #764ba2;
            gap: 10px;
        }

        .contact-info a i {
            font-size: 16px;
        }

        /* Progress Dots */
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.3);
            animation: dot-pulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .maintenance-container {
                padding: 32px 24px;
                border-radius: 24px;
            }

            .maintenance-icon {
                width: 100px;
                height: 100px;
                margin-bottom: 24px;
            }

            .maintenance-icon i {
                font-size: 44px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .maintenance-text {
                font-size: 1rem;
            }

            .status-info {
                padding: 16px;
            }

            .access-form {
                padding: 20px;
            }

            .status-row strong {
                min-width: 100px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .maintenance-container {
                padding: 28px 20px;
            }

            .maintenance-icon {
                width: 80px;
                height: 80px;
            }

            .maintenance-icon i {
                font-size: 36px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .status-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .status-row strong {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <!-- Icon -->
        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>

        <!-- Title & Description -->
        <h1>🔧 Website Sedang Maintenance</h1>
        <p class="maintenance-text">
            Kami sedang melakukan pembaruan sistem untuk memberikan pengalaman terbaik. 
            Website akan kembali online dalam waktu dekat.
        </p>

        <!-- Status Info -->
        <div class="status-info">
            <div class="status-row">
                <i class="fas fa-circle-notch"></i>
                <strong>Status:</strong>
                <span>Sedang Maintenance</span>
            </div>
            <div class="status-row">
                <i class="fas fa-clock"></i>
                <strong>Estimasi Waktu:</strong>
                <span>~ 2 jam</span>
            </div>
            <div class="status-row">
                <i class="fas fa-sync-alt"></i>
                <strong>Last Update:</strong>
                <span id="updateTime">Just now</span>
            </div>
        </div>

        <!-- Code Info (shown if active code exists) -->
        <div id="codeInfoSection" class="code-info">
            <p>
                <i class="fas fa-check-circle"></i>
                <span>Kode akses tersedia</span>
            </p>
        </div>

        <!-- Access Form -->
        <div class="access-form">
            <div class="form-header">
                <i class="fas fa-key"></i>
                <h3>Akses Admin</h3>
            </div>
            
            <form onsubmit="checkAccess(event)">
                <div class="form-group">
                    <label for="accessPin">
                        <i class="fas fa-lock"></i> Kode Akses (berlaku 24 jam)
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="accessPin" 
                            placeholder="Masukkan kode 6 digit..." 
                            autocomplete="off"
                            maxlength="6"
                        >
                        <i class="fas fa-shield-alt input-icon"></i>
                    </div>
                </div>
                <button type="submit" class="maintenance-btn">
                    <span id="btnText">Verifikasi Akses</span>
                </button>
                
                <button type="button" class="maintenance-btn btn-secondary" onclick="requestAccessCode()">
                    <i class="fab fa-whatsapp"></i>
                    <span>Minta Kode ke Admin</span>
                </button>
                
                <div class="error-message message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>
                <div class="success-message message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span></span>
                </div>
            </form>

            <div class="progress-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <!-- Contact Info -->
        <div class="contact-info">
            <p>
                Butuh bantuan? 
                <a href="https://wa.me/62895404147521" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-whatsapp"></i>
                    Hubungi Admin
                </a>
            </p>
        </div>
    </div>

    <script>
        // ========================================
        // Access Code Management System
        // ========================================

        // Generate secure random code (6 digits)
        function generateAccessCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Generate code with 24-hour expiry
        function generateTimedCode() {
            const code = generateAccessCode();
            const expiry = Date.now() + (24 * 60 * 60 * 1000); // 24 hours
            
            const codeData = {
                code: code,
                expiry: expiry,
                generated: Date.now()
            };
            
            localStorage.setItem('fx_temp_access_code', JSON.stringify(codeData));
            
            console.log('🔑 Access code generated:', code);
            console.log('⏰ Expires:', new Date(expiry).toLocaleString('id-ID'));
            
            return codeData;
        }

        // Get current valid code
        function getCurrentCode() {
            try {
                const raw = localStorage.getItem('fx_temp_access_code');
                if (!raw) return null;
                
                const data = JSON.parse(raw);
                
                // Check if expired
                if (Date.now() > data.expiry) {
                    localStorage.removeItem('fx_temp_access_code');
                    console.log('⏰ Code expired');
                    return null;
                }
                
                return data;
            } catch (e) {
                console.error('Error reading code:', e);
                return null;
            }
        }

        // Format time remaining
        function getTimeRemaining(expiry) {
            const diff = expiry - Date.now();
            if (diff <= 0) return 'Expired';
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (hours > 0) {
                return `${hours} jam ${minutes} menit`;
            }
            return `${minutes} menit`;
        }

        // Read maintenance config from localStorage if available
        function getMaintenanceConfig(){
            try{ 
                const raw = localStorage.getItem('fx_maintenance_config'); 
                if(raw) return JSON.parse(raw); 
            }catch(e){ console.warn('Config error:', e); }
            return null;
        }

        // Function to get device IP (best-effort)
        async function getDeviceIP() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch('https://api.ipify.org?format=json', {
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const data = await response.json();
                console.log('📍 IP detected:', data.ip);
                return data.ip;
            } catch (error) {
                console.warn('⚠️ Could not get IP:', error.message);
                return 'unknown';
            }
        }

        // Handle access verification (PIN bypass)
        async function checkAccess(event) {
            event.preventDefault();
            
            const pin = document.getElementById('accessPin').value.trim();
            const btn = document.querySelector('.maintenance-btn');
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');

            // Hide messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if(!pin){
                errorMsg.querySelector('span').textContent = 'Silakan masukkan kode akses';
                errorMsg.style.display = 'flex';
                return;
            }

            const cfg = getMaintenanceConfig() || {};
            const adminPin = cfg.adminPin || '1234';
            const currentCode = getCurrentCode();

            // Show loading
            btnText.innerHTML = '<span class="spinner"></span> Memverifikasi...';
            btn.disabled = true;

            // Simulate verification delay
            setTimeout(async () => {
                try {
                    // Check IP
                    const userIP = await getDeviceIP();
                    const allowedIPs = Array.isArray(cfg.allowedIPs) ? cfg.allowedIPs : [];

                    console.log('🔍 Checking access:', { pin, userIP, allowedIPs });

                    // Verify: Admin PIN OR Temporary Code OR Allowed IP
                    const isValidPin = pin === adminPin;
                    const isValidTempCode = currentCode && pin === currentCode.code;
                    const isAllowedIP = allowedIPs.length && allowedIPs.includes(userIP);

                    if(isValidPin || isValidTempCode || isAllowedIP){
                        // Success
                        let accessType = isValidPin ? 'Admin PIN' : (isValidTempCode ? 'Temporary Code' : 'Allowed IP');
                        successMsg.querySelector('span').textContent = `Akses diterima (${accessType})! Mengalihkan...`;
                        successMsg.style.display = 'flex';
                        
                        // Store access
                        sessionStorage.setItem('maintenanceAccess','true');
                        sessionStorage.setItem('accessTime', Date.now().toString());
                        sessionStorage.setItem('accessType', accessType);
                        
                        console.log(`✅ Access granted via ${accessType}`);
                        
                        // If temporary code was used, remove it
                        if (isValidTempCode) {
                            localStorage.removeItem('fx_temp_access_code');
                            console.log('🔑 Temporary code consumed');
                        }
                        
                        // Redirect after delay
                        setTimeout(() => { 
                            window.location.href = 'index.html'; 
                        }, 1000);
                    } else {
                        // Failed
                        errorMsg.querySelector('span').textContent = 'Kode akses salah, expired, atau IP tidak diizinkan';
                        errorMsg.style.display = 'flex';
                        btnText.textContent = 'Verifikasi Akses';
                        btn.disabled = false;
                        document.getElementById('accessPin').value = '';
                        
                        console.log('❌ Access denied');
                    }
                } catch (error) {
                    console.error('❌ Verification error:', error);
                    errorMsg.querySelector('span').textContent = 'Terjadi kesalahan, coba lagi';
                    errorMsg.style.display = 'flex';
                    btnText.textContent = 'Verifikasi Akses';
                    btn.disabled = false;
                }
            }, 1000);
        }

        // Request code from admin via WhatsApp
        function requestAccessCode() {
            const adminPhone = '62895404147521';
            const message = encodeURIComponent('Halo Admin, saya memerlukan kode akses untuk FX Community yang sedang maintenance. Terima kasih!');
            const whatsappURL = `https://wa.me/${adminPhone}?text=${message}`;
            
            window.open(whatsappURL, '_blank');
            console.log('📱 Opening WhatsApp to request code');
        }

        // Update time display
        function updateTimeDisplay() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('updateTime').textContent = `${hours}:${minutes} WIB`;
        }

        // Check and display code info on load
        function checkCodeStatus() {
            const currentCode = getCurrentCode();
            const infoSection = document.getElementById('codeInfoSection');
            
            if (currentCode) {
                const remaining = getTimeRemaining(currentCode.expiry);
                infoSection.querySelector('span').textContent = `Kode akses aktif • Berlaku ${remaining} lagi`;
                infoSection.style.display = 'block';
                console.log('✅ Active code found, expires in:', remaining);
            } else {
                infoSection.style.display = 'none';
            }
        }

        // Initialize
        updateTimeDisplay();
        setInterval(updateTimeDisplay, 60000); // Update every minute
        checkCodeStatus();
        setInterval(checkCodeStatus, 60000); // Check code status every minute

        // Show initial time
        console.log('🔧 Maintenance page loaded');
        
        // Developer mode: Generate code in console
        console.log('💡 Developer Tips:');
        console.log('- To generate temporary code: generateTimedCode()');
        console.log('- To check current code: getCurrentCode()');
        console.log('- Code expires in 24 hours');
        console.log('- Copy generated code and send to users via WhatsApp');
    </script>
</body>
</html>
