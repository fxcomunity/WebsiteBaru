<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Sedang Maintenance - FX Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122b;
            --bg-card: rgba(30, 30, 60, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #a8a8d8;
            --text-muted: #6b6b8f;
            --border: rgba(99, 102, 241, 0.2);
            --success: #10b981;
            --shadow: rgba(0, 0, 0, 0.3);
            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Animation Enhanced */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            animation: move 20s infinite alternate;
        }

        .glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            animation: move 25s infinite alternate-reverse;
        }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        /* Main Container */
        .maintenance-container {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: clamp(24px, 5vw, 40px);
            padding: clamp(30px, 6vw, 60px);
            text-align: center;
            max-width: 650px;
            width: 100%;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Icon Animation */
        .maintenance-icon {
            width: clamp(80px, 15vw, 120px);
            height: clamp(80px, 15vw, 120px);
            margin: 0 auto clamp(24px, 4vw, 40px);
            background: var(--gradient-primary);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px var(--shadow);
            animation: morph 8s ease-in-out infinite;
            position: relative;
        }

        @keyframes morph {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
            50% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; }
        }

        .maintenance-icon i {
            font-size: clamp(32px, 6vw, 52px);
            color: white;
            animation: rotate-tool 4s linear infinite;
        }

        @keyframes rotate-tool {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-20deg); }
            75% { transform: rotate(20deg); }
            100% { transform: rotate(0deg); }
        }

        /* Typography */
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(to right, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .maintenance-text {
            color: var(--text-secondary);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            margin-bottom: clamp(30px, 5vw, 48px);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Status Card */
        .status-info {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: clamp(16px, 3vw, 24px);
            margin-bottom: 32px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }

        .status-item {
            text-align: center;
            padding: 12px;
        }

        .status-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .status-value {
            display: block;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .status-value i {
            color: var(--primary);
            margin-right: 6px;
        }

        /* Access Form */
        .access-form {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: clamp(20px, 4vw, 32px);
            margin-top: 32px;
        }

        .form-header {
            margin-bottom: 24px;
        }

        .form-header h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-header h3 i {
            color: var(--primary);
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .maintenance-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .maintenance-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--border);
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: var(--glass);
            border-color: var(--primary);
        }

        /* Footer Info */
        .contact-info {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .contact-info a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }

        .contact-info a:hover {
            color: white;
            text-decoration: underline;
        }

        /* Messages */
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .error-message { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .success-message { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .code-info {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="bg-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>
    <div class="maintenance-container">
        <!-- Icon -->
        <div class="maintenance-icon">
            <i class="fas fa-screwdriver-wrench"></i>
        </div>

        <!-- Title & Description -->
        <h1>Maintenance Mode</h1>
        <p class="maintenance-text">
            Situs kami sedang dalam peningkatan untuk memberikan layanan yang lebih baik. Silakan cek kembali beberapa saat lagi.
        </p>

        <!-- Status Info -->
        <div class="status-info">
            <div class="status-item">
                <span class="status-label">Status</span>
                <span class="status-value"><i class="fas fa-cog fa-spin"></i> Updating</span>
            </div>
            <div class="status-item">
                <span class="status-label">Estimasi</span>
                <span class="status-value"><i class="fas fa-clock"></i> ~ 2 Jam</span>
            </div>
            <div class="status-item">
                <span class="status-label">Wilayah</span>
                <span class="status-value"><i class="fas fa-globe"></i> Global</span>
            </div>
        </div>

        <!-- Code Info -->
        <div id="codeInfoSection" class="code-info">
            <i class="fas fa-key"></i> <span>Kode akses tersedia</span>
        </div>

        <!-- Access Form -->
        <div class="access-form">
            <div class="form-header">
                <h3><i class="fas fa-user-shield"></i> Portal Akses Khusus</h3>
            </div>
            
            <form onsubmit="checkAccess(event)">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="accessPin" 
                        placeholder="Masukkan Kode Akses..." 
                        autocomplete="off"
                        maxlength="6"
                    >
                    <i class="fas fa-lock input-icon"></i>
                </div>
                
                <button type="submit" class="maintenance-btn">
                    <span id="btnText">Masuk Sekarang</span>
                </button>
                
                <button type="button" class="maintenance-btn btn-secondary" onclick="requestAccessCode()">
                    <i class="fab fa-whatsapp"></i>
                    <span>Hubungi Admin</span>
                </button>
                
                <div class="error-message message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>
                <div class="success-message message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span></span>
                </div>
            </form>
        </div>

        <!-- Contact Info -->
        <div class="contact-info">
            <p>
                Informasi lebih lanjut? 
                <a href="https://wa.me/62895404147521" target="_blank">
                    WhatsApp FX Support
                </a>
            </p>
        </div>
    </div>

    <script>
        // ========================================
        // Access Code Management System
        // ========================================

        // Generate secure random code (6 digits)
        function generateAccessCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Generate code with 24-hour expiry
        function generateTimedCode() {
            const code = generateAccessCode();
            const expiry = Date.now() + (24 * 60 * 60 * 1000); // 24 hours
            
            const codeData = {
                code: code,
                expiry: expiry,
                generated: Date.now()
            };
            
            localStorage.setItem('fx_temp_access_code', JSON.stringify(codeData));
            
            console.log('🔑 Access code generated:', code);
            console.log('⏰ Expires:', new Date(expiry).toLocaleString('id-ID'));
            
            return codeData;
        }

        // Get current valid code
        function getCurrentCode() {
            try {
                const raw = localStorage.getItem('fx_temp_access_code');
                if (!raw) return null;
                
                const data = JSON.parse(raw);
                
                // Check if expired
                if (Date.now() > data.expiry) {
                    localStorage.removeItem('fx_temp_access_code');
                    console.log('⏰ Code expired');
                    return null;
                }
                
                return data;
            } catch (e) {
                console.error('Error reading code:', e);
                return null;
            }
        }

        // Format time remaining
        function getTimeRemaining(expiry) {
            const diff = expiry - Date.now();
            if (diff <= 0) return 'Expired';
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (hours > 0) {
                return `${hours} jam ${minutes} menit`;
            }
            return `${minutes} menit`;
        }

        // Read maintenance config from localStorage if available
        function getMaintenanceConfig(){
            try{ 
                const raw = localStorage.getItem('fx_maintenance_config'); 
                if(raw) return JSON.parse(raw); 
            }catch(e){ console.warn('Config error:', e); }
            return null;
        }

        // Function to get device IP (best-effort)
        async function getDeviceIP() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch('https://api.ipify.org?format=json', {
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const data = await response.json();
                console.log('📍 IP detected:', data.ip);
                return data.ip;
            } catch (error) {
                console.warn('⚠️ Could not get IP:', error.message);
                return 'unknown';
            }
        }

        // Handle access verification (PIN bypass)
        async function checkAccess(event) {
            event.preventDefault();
            
            const pin = document.getElementById('accessPin').value.trim();
            const btn = document.querySelector('.maintenance-btn');
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');

            // Hide messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if(!pin){
                errorMsg.querySelector('span').textContent = 'Silakan masukkan kode akses';
                errorMsg.style.display = 'flex';
                return;
            }

            const cfg = getMaintenanceConfig() || {};
            const adminPin = cfg.adminPin || '1234';
            const currentCode = getCurrentCode();

            // Show loading
            btnText.innerHTML = '<span class="spinner"></span> Memverifikasi...';
            btn.disabled = true;

            // Simulate verification delay
            setTimeout(async () => {
                try {
                    // Check IP
                    const userIP = await getDeviceIP();
                    const allowedIPs = Array.isArray(cfg.allowedIPs) ? cfg.allowedIPs : [];

                    console.log('🔍 Checking access:', { pin, userIP, allowedIPs });

                    // Verify: Admin PIN OR Temporary Code OR Allowed IP
                    const isValidPin = pin === adminPin;
                    const isValidTempCode = currentCode && pin === currentCode.code;
                    const isAllowedIP = allowedIPs.length && allowedIPs.includes(userIP);

                    if(isValidPin || isValidTempCode || isAllowedIP){
                        // Success
                        let accessType = isValidPin ? 'Admin PIN' : (isValidTempCode ? 'Temporary Code' : 'Allowed IP');
                        successMsg.querySelector('span').textContent = `Akses diterima (${accessType})! Mengalihkan...`;
                        successMsg.style.display = 'flex';
                        
                        // Store access
                        sessionStorage.setItem('maintenanceAccess','true');
                        sessionStorage.setItem('accessTime', Date.now().toString());
                        sessionStorage.setItem('accessType', accessType);
                        
                        console.log(`✅ Access granted via ${accessType}`);
                        
                        // If temporary code was used, remove it
                        if (isValidTempCode) {
                            localStorage.removeItem('fx_temp_access_code');
                            console.log('🔑 Temporary code consumed');
                        }
                        
                        // Redirect after delay
                        setTimeout(() => { 
                            window.location.href = 'index.html'; 
                        }, 1000);
                    } else {
                        // Failed
                        errorMsg.querySelector('span').textContent = 'Kode akses salah, expired, atau IP tidak diizinkan';
                        errorMsg.style.display = 'flex';
                        btnText.textContent = 'Verifikasi Akses';
                        btn.disabled = false;
                        document.getElementById('accessPin').value = '';
                        
                        console.log('❌ Access denied');
                    }
                } catch (error) {
                    console.error('❌ Verification error:', error);
                    errorMsg.querySelector('span').textContent = 'Terjadi kesalahan, coba lagi';
                    errorMsg.style.display = 'flex';
                    btnText.textContent = 'Verifikasi Akses';
                    btn.disabled = false;
                }
            }, 1000);
        }

        // Request code from admin via WhatsApp
        function requestAccessCode() {
            const adminPhone = '62895404147521';
            const message = encodeURIComponent('Halo Admin, saya memerlukan kode akses untuk FX Community yang sedang maintenance. Terima kasih!');
            const whatsappURL = `https://wa.me/${adminPhone}?text=${message}`;
            
            window.open(whatsappURL, '_blank');
            console.log('📱 Opening WhatsApp to request code');
        }

        // Update time display
        function updateTimeDisplay() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('updateTime').textContent = `${hours}:${minutes} WIB`;
        }

        // Check and display code info on load
        function checkCodeStatus() {
            const currentCode = getCurrentCode();
            const infoSection = document.getElementById('codeInfoSection');
            
            if (currentCode) {
                const remaining = getTimeRemaining(currentCode.expiry);
                infoSection.querySelector('span').textContent = `Kode akses aktif • Berlaku ${remaining} lagi`;
                infoSection.style.display = 'block';
                console.log('✅ Active code found, expires in:', remaining);
            } else {
                infoSection.style.display = 'none';
            }
        }

        // Initialize
        updateTimeDisplay();
        setInterval(updateTimeDisplay, 60000); // Update every minute
        checkCodeStatus();
        setInterval(checkCodeStatus, 60000); // Check code status every minute

        // Show initial time
        console.log('🔧 Maintenance page loaded');
        
        // Developer mode: Generate code in console
        console.log('💡 Developer Tips:');
        console.log('- To generate temporary code: generateTimedCode()');
        console.log('- To check current code: getCurrentCode()');
        console.log('- Code expires in 24 hours');
        console.log('- Copy generated code and send to users via WhatsApp');
    </script>
</body>
</html>
