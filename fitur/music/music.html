<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik - FX Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a35;
            --bg-card: #232347;
            --bg-hover: #2d2d5f;
            --text-primary: #ffffff;
            --text-secondary: #a8a8d8;
            --text-muted: #6b6b8f;
            --border: #3a3a5f;
            --success: #10b981;
            --shadow: rgba(99, 102, 241, 0.1);
            --shadow-lg: rgba(99, 102, 241, 0.2);
            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            --gradient-accent: linear-gradient(135deg, var(--accent) 0%, var(--secondary) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .fitur-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: clamp(12px, 3vw, 20px);
            position: relative;
            z-index: 1;
        }

        /* Header */
        .fitur-header {
            display: flex;
            align-items: center;
            gap: clamp(12px, 3vw, 20px);
            margin-bottom: clamp(20px, 4vw, 32px);
            padding: clamp(14px, 3vw, 20px);
            background: var(--bg-card);
            border-radius: clamp(12px, 3vw, 20px);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .fitur-header a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(40px, 10vw, 44px);
            height: clamp(40px, 10vw, 44px);
            background: var(--gradient-primary);
            border-radius: clamp(10px, 2.5vw, 12px);
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow);
            flex-shrink: 0;
        }

        .fitur-header a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-lg);
        }

        .fitur-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.1rem, 4vw, 2rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 12px);
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .fitur-header h1 i {
            font-size: clamp(1rem, 3.5vw, 1.5rem);
        }

        /* Music Player Section */
        .music-player-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(16px, 3vw, 24px);
        }

        @media (min-width: 768px) {
            .music-player-section {
                grid-template-columns: minmax(300px, 400px) 1fr;
            }
        }

        @media (min-width: 1024px) {
            .music-player-section {
                grid-template-columns: minmax(350px, 450px) 1fr;
            }
        }

        /* Player Card */
        .player-card {
            background: var(--bg-card);
            border-radius: clamp(16px, 4vw, 24px);
            padding: clamp(20px, 5vw, 32px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            height: fit-content;
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.05) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        /* Album Art */
        .album-art-container {
            position: relative;
            margin-bottom: clamp(20px, 4vw, 28px);
            z-index: 1;
        }

        .album-art {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 1;
            background: var(--gradient-primary);
            border-radius: clamp(16px, 4vw, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3rem, 12vw, 6rem);
            box-shadow: 0 12px 40px var(--shadow-lg);
            position: relative;
            overflow: hidden;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .album-art::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            pointer-events: none;
        }

        .album-art.playing {
            animation: float 6s ease-in-out infinite, rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Vinyl Effect */
        .vinyl-effect {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: clamp(80px, 20vw, 120px);
            height: clamp(80px, 20vw, 120px);
            background: var(--gradient-accent);
            border-radius: 50%;
            opacity: 0.3;
            filter: blur(30px);
            animation: vinyl-glow 4s ease-in-out infinite;
        }

        @keyframes vinyl-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Track Info */
        .track-info {
            text-align: center;
            margin-bottom: clamp(24px, 5vw, 32px);
            z-index: 1;
            position: relative;
        }

        .music-title {
            font-size: clamp(1.1rem, 4vw, 1.75rem);
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            margin-bottom: clamp(6px, 1.5vw, 8px);
            color: var(--text-primary);
            line-height: 1.3;
        }

        .music-artist {
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Player Controls */
        .player-controls {
            z-index: 1;
            position: relative;
        }

        .big-play-btn {
            width: clamp(64px, 15vw, 80px);
            height: clamp(64px, 15vw, 80px);
            border-radius: 50%;
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-size: clamp(22px, 5vw, 28px);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto clamp(16px, 3vw, 20px);
        }

        .big-play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px var(--shadow-lg);
        }

        .big-play-btn:active {
            transform: scale(0.98);
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: clamp(5px, 1.5vw, 6px);
            background: var(--bg-secondary);
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: clamp(10px, 2vw, 12px);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        #progress {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 10px;
            transition: width 0.1s ease;
            position: relative;
        }

        #progress::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(12px, 3vw, 14px);
            height: clamp(12px, 3vw, 14px);
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Time Display */
        .time-display {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: clamp(0.75rem, 2vw, 0.875rem);
            font-weight: 500;
            margin-bottom: clamp(20px, 4vw, 24px);
        }

        /* Control Buttons */
        .controls-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2vw, 12px);
            margin-bottom: clamp(16px, 3vw, 20px);
        }

        .control-btn {
            width: clamp(42px, 10vw, 48px);
            height: clamp(42px, 10vw, 48px);
            border-radius: clamp(10px, 2.5vw, 12px);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: clamp(16px, 3.5vw, 18px);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .play-btn {
            width: clamp(50px, 12vw, 56px);
            height: clamp(50px, 12vw, 56px);
            background: var(--gradient-primary);
            border: none;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .play-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px var(--shadow-lg);
        }

        /* Volume Control */
        .volume-control {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2.5vw, 12px);
            padding: clamp(12px, 3vw, 16px);
            background: var(--bg-secondary);
            border-radius: clamp(12px, 3vw, 16px);
            border: 1px solid var(--border);
        }

        #volumeLabel {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: clamp(0.8rem, 2vw, 0.875rem);
            min-width: clamp(28px, 6vw, 32px);
        }

        #volumeSlider {
            flex: 1;
            height: clamp(5px, 1.5vw, 6px);
            border-radius: 10px;
            background: var(--bg-primary);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: clamp(14px, 3.5vw, 16px);
            height: clamp(14px, 3.5vw, 16px);
            border-radius: 50%;
            background: var(--gradient-primary);
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.3s ease;
        }

        #volumeSlider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #volumeSlider::-moz-range-thumb {
            width: clamp(14px, 3.5vw, 16px);
            height: clamp(14px, 3.5vw, 16px);
            border-radius: 50%;
            background: var(--gradient-primary);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px var(--shadow);
        }

        /* Music List */
        .playlist-card {
            background: var(--bg-card);
            border-radius: clamp(16px, 4vw, 24px);
            padding: clamp(20px, 4vw, 28px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .music-list-header {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2.5vw, 12px);
            margin-bottom: clamp(16px, 3vw, 20px);
            padding-bottom: clamp(12px, 3vw, 16px);
            border-bottom: 2px solid var(--border);
        }

        .music-list-header i {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
        }

        .music-list-header h3 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.1rem, 3.5vw, 1.5rem);
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .music-list {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.5vw, 8px);
            max-height: clamp(400px, 60vh, 600px);
            overflow-y: auto;
            padding-right: clamp(6px, 1.5vw, 8px);
        }

        /* Custom Scrollbar */
        .music-list::-webkit-scrollbar {
            width: clamp(6px, 1.5vw, 8px);
        }

        .music-list::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 10px;
        }

        .music-list::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .music-list::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        /* Music Item */
        .music-item {
            display: flex;
            align-items: center;
            gap: clamp(12px, 3vw, 16px);
            padding: clamp(10px, 2.5vw, 14px);
            background: var(--bg-secondary);
            border-radius: clamp(12px, 3vw, 16px);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .music-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--gradient-primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .music-item:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .music-item:hover::before {
            transform: scaleY(1);
        }

        .music-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
            border-color: var(--primary);
        }

        .music-item.active::before {
            transform: scaleY(1);
        }

        .music-item-icon {
            width: clamp(44px, 10vw, 48px);
            height: clamp(44px, 10vw, 48px);
            min-width: clamp(44px, 10vw, 48px);
            border-radius: clamp(10px, 2.5vw, 12px);
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(18px, 4vw, 20px);
            color: white;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .music-item.active .music-item-icon {
            animation: pulse-icon 2s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 12px var(--shadow); }
            50% { transform: scale(1.05); box-shadow: 0 6px 16px var(--shadow-lg); }
        }

        .music-item-info {
            flex: 1;
            min-width: 0;
        }

        .music-item-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
        }

        .music-item-artist {
            color: var(--text-secondary);
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-item-duration {
            color: var(--text-muted);
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            font-weight: 500;
            padding: clamp(3px, 1vw, 4px) clamp(8px, 2vw, 12px);
            background: var(--bg-primary);
            border-radius: clamp(6px, 1.5vw, 8px);
            flex-shrink: 0;
        }

        /* Footer */
        #footer-container {
            margin-top: clamp(40px, 8vw, 60px);
            padding: clamp(24px, 5vw, 32px) clamp(12px, 3vw, 20px);
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            border-radius: clamp(16px, 4vw, 24px) clamp(16px, 4vw, 24px) 0 0;
        }

        /* Mobile Specific Adjustments */
        @media (max-width: 767px) {
            .music-player-section {
                grid-template-columns: 1fr;
            }

            .player-card {
                margin-bottom: 0;
            }

            .music-list {
                max-height: 50vh;
            }
        }

        /* Small Mobile */
        @media (max-width: 480px) {
            .music-item-duration {
                display: none;
            }

            .fitur-header h1 i {
                display: none;
            }
        }

        /* Large Screens */
        @media (min-width: 1400px) {
            .fitur-container {
                padding: 20px 40px;
            }
        }

        /* Landscape Mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .music-player-section {
                grid-template-columns: 1fr 1fr;
            }

            .album-art {
                max-width: 250px;
            }

            .music-list {
                max-height: 300px;
            }

            .big-play-btn {
                width: 60px;
                height: 60px;
            }
        }

        /* Utility Classes */
        .centered {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Loading State */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Smooth Transitions */
        * {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
    </style>
    <script src="../../maintenance-check.js"></script>
</head>

<body class="fitur-body">
    <div class="fitur-container">
        <!-- Header -->
        <div class="fitur-header">
            <a href="../../index.html" title="Kembali ke beranda">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1>
                <i class="fas fa-music"></i>
                Musik Focus
            </h1>
        </div>

        <!-- Music Player Section -->
        <div class="music-player-section">
            <!-- Player Card -->
            <div class="player-card">
                <!-- Album Art -->
                <div class="album-art-container">
                    <div class="album-art" id="albumArt">🎵</div>
                    <div class="vinyl-effect"></div>
                </div>

                <!-- Track Info -->
                <div class="track-info">
                    <div class="music-title" id="nowPlayingTitle">Pilih Lagu</div>
                    <div class="music-artist" id="nowPlayingArtist">FX Community Playlist</div>
                </div>

                <!-- Player Controls -->
                <div class="player-controls">
                    <!-- Big Play Button -->
                    <button class="big-play-btn" id="mainPlayBtn" aria-label="Play/Pause">
                        <i class="fas fa-play"></i>
                    </button>

                    <!-- Progress Bar -->
                    <div class="progress-bar" id="progressBar">
                        <div id="progress"></div>
                    </div>

                    <!-- Time Display -->
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>

                    <!-- Control Buttons -->
                    <div class="controls-wrapper">
                        <button class="control-btn" id="prevBtn" title="Previous">
                            <i class="fas fa-step-backward"></i>
                        </button>
                        <button class="control-btn play-btn" id="playPauseBtn" title="Play/Pause">
                            <i class="fas fa-play"></i>
                        </button>
                        <button class="control-btn" id="nextBtn" title="Next">
                            <i class="fas fa-step-forward"></i>
                        </button>
                    </div>

                    <!-- Volume Control -->
                    <div class="volume-control">
                        <label id="volumeLabel"><i class="fas fa-volume-up"></i></label>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
                    </div>

                    <!-- Audio Element -->
                    <audio id="audioPlayer"></audio>
                </div>
            </div>

            <!-- Playlist Card -->
            <div class="playlist-card">
                <div class="music-list-header">
                    <i class="fas fa-list-ul"></i>
                    <h3>Daftar Putar</h3>
                </div>
                <div class="music-list" id="musicList">
                    <!-- Music items will be inserted here by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../../music-data.js"></script>
    <script src="music.js"></script>
    <script>
        // Load footer
        fetch('../../footer/music.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('footer-container').innerHTML = html;
            })
            .catch(err => console.log('Footer load error:', err));

        // Add playing animation to album art
        const audio = document.getElementById('audioPlayer');
        const albumArt = document.getElementById('albumArt');
        
        audio.addEventListener('play', () => {
            albumArt.classList.add('playing');
        });
        
        audio.addEventListener('pause', () => {
            albumArt.classList.remove('playing');
        });

        // Update volume icon based on level
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeLabel = document.getElementById('volumeLabel');
        
        volumeSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            if (value == 0) {
                volumeLabel.innerHTML = '<i class="fas fa-volume-mute"></i>';
            } else if (value < 0.5) {
                volumeLabel.innerHTML = '<i class="fas fa-volume-down"></i>';
            } else {
                volumeLabel.innerHTML = '<i class="fas fa-volume-up"></i>';
            }
        });
    </script>
</body>

</html>
