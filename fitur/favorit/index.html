<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorit Saya — FX Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../loader/style.css">
    <script src="../../loader/script.js"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --ink: #0a0a0f;
            --surface: #12121e;
            --surface-glass: rgba(28, 28, 46, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(124, 95, 255, 0.3);
            --accent: #7c5fff;
            --accent-2: #e35fff;
            --accent-3: #5fddff;
            --text: #f0eeff;
            --text-dim: #8886a8;
            --text-muted: #4e4c6a;
            --success: #4fffb0;
            --danger: #ff5f7e;
            --warning: #ffc94d;
        }

        body {
            background: var(--ink);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* ── BG EFFECTS ── */
        .scene-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent), transparent 70%);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
            bottom: -80px;
            right: -80px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-3), transparent 70%);
            top: 40%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(50px, 40px) scale(1.15);
            }
        }

        /* ── PAGE CONTAINER ── */
        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 100px 28px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── HEADER ── */
        .page-header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeUp 0.7s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 16px;
            background: rgba(124, 95, 255, 0.1);
            border: 1px solid rgba(124, 95, 255, 0.25);
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 14px;
        }

        .page-badge i {
            font-size: 10px;
        }

        .page-title {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 900;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .page-subtitle {
            font-size: clamp(0.9rem, 2vw, 1rem);
            color: var(--text-dim);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .page-subtitle strong {
            color: var(--accent);
            font-weight: 700;
        }

        /* ── CONTROLS ── */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 48px;
            animation: fadeUp 0.7s ease 0.1s both;
        }

        .ctrl-btn {
            padding: 11px 22px;
            background: var(--surface-glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            white-space: nowrap;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
            border-color: var(--border-glow);
            box-shadow: 0 8px 24px rgba(124, 95, 255, 0.2);
        }

        .ctrl-btn i {
            font-size: 13px;
        }

        .ctrl-btn.danger {
            color: var(--danger);
            border-color: rgba(255, 95, 126, 0.2);
        }

        .ctrl-btn.danger:hover {
            background: rgba(255, 95, 126, 0.08);
            border-color: var(--danger);
        }

        /* ── FAVORITES GRID ── */
        .fav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
            gap: 24px;
            animation: fadeUp 0.7s ease 0.2s both;
        }

        .fav-card {
            position: relative;
            background: var(--surface-glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(20px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .fav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .fav-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glow);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        .fav-card:hover::before {
            opacity: 1;
        }

        .fav-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
            display: block;
            line-height: 1;
            filter: drop-shadow(0 4px 16px rgba(124, 95, 255, 0.3));
        }

        .fav-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.35;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-clamp: 2;
            min-height: 2.7rem;
        }

        .fav-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(124, 95, 255, 0.08);
            border: 1px solid rgba(124, 95, 255, 0.2);
            border-radius: 100px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 18px;
        }

        .fav-actions {
            display: flex;
            gap: 10px;
        }

        .fav-btn {
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .fav-btn-view {
            flex: 1;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            box-shadow: 0 4px 16px rgba(124, 95, 255, 0.3);
        }

        .fav-btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 95, 255, 0.5);
        }

        .fav-btn-remove {
            width: 44px;
            height: 44px;
            background: rgba(255, 95, 126, 0.08);
            border: 1px solid rgba(255, 95, 126, 0.2);
            color: var(--danger);
        }

        .fav-btn-remove:hover {
            background: var(--danger);
            color: white;
            transform: rotate(90deg) scale(1.08);
        }

        /* ── EMPTY STATE ── */
        .empty {
            text-align: center;
            padding: 80px 40px;
            background: var(--surface-glass);
            border: 2px dashed var(--border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            animation: fadeUp 0.7s ease 0.2s both;
        }

        .empty-icon {
            font-size: 5rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            opacity: 0.4;
            display: block;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 0.25;
                transform: scale(0.95);
            }
        }

        .empty-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 10px;
        }

        .empty-sub {
            color: var(--text-dim);
            margin-bottom: 32px;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .empty-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 16px rgba(124, 95, 255, 0.3);
        }

        .empty-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(124, 95, 255, 0.5);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            padding: 14px 24px;
            background: var(--surface-glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            backdrop-filter: blur(30px);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: calc(100vw - 56px);
        }

        @keyframes toastIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.show {
            display: flex;
        }

        .toast.success {
            border-color: rgba(79, 255, 176, 0.3);
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-color: rgba(255, 95, 126, 0.3);
            border-left: 4px solid var(--danger);
        }

        .toast i {
            font-size: 16px;
        }

        /* ── NAV HEADER ── */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--text);
            text-decoration: none;
        }

        .nav-mark {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: var(--surface-glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            backdrop-filter: blur(20px);
        }

        .nav-btn:hover {
            color: var(--text);
            border-color: var(--border-glow);
            transform: translateY(-1px);
        }

        .nav-btn i {
            font-size: 14px;
        }

        /* Admin dropdown */
        .admin-profile-container {
            position: relative;
        }

        .admin-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 200px;
            background: var(--surface-glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(30px);
            display: none;
            z-index: 300;
            animation: dropIn 0.2s ease;
        }

        @keyframes dropIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .admin-dropdown.active {
            display: block;
        }

        .dropdown-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 6px;
        }

        .admin-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .admin-info span {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text);
        }

        .admin-info small {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            color: var(--text-dim);
            cursor: pointer;
            text-decoration: none;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.15s;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .dropdown-item.logout {
            color: var(--danger);
        }

        .dropdown-item.logout:hover {
            background: rgba(255, 95, 126, 0.08);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page {
                padding: 90px 20px 48px;
            }

            .fav-grid {
                grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
                gap: 20px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .ctrl-btn {
                justify-content: center;
            }

            .nav {
                padding: 0 16px;
            }
        }

        @media (max-width: 480px) {
            .fav-grid {
                grid-template-columns: 1fr;
            }

            .page-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

    <script>
        // Favorites Logic
        function removeFavorite(url) {
            const index = favorites.findIndex(fav => fav.url === url);
            if (index > -1) {
                favorites.splice(index, 1);
                localStorage.setItem('pdfFavorites', JSON.stringify(favorites));
                showNotification('Dihapus dari favorit');
                renderFavoritesPage();
            }
        }

        function viewPDF(url) {
            window.open(url, '_blank');
        }

        function showNotification(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast show ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function renderFavoritesPage() {
            const listContainer = document.getElementById('favoritesList');
            const subtitle = document.getElementById('pageSubtitle');

            if (favorites.length === 0) {
                subtitle.innerHTML = 'Anda belum memiliki PDF favorit';
                listContainer.innerHTML = `
                <div class="empty">
                    <i class="fas fa-heart-broken empty-icon"></i>
                    <div class="empty-title">Belum ada favorit</div>
                    <div class="empty-sub">Klik ikon hati pada PDF untuk menambahkannya ke koleksi favorit Anda</div>
                    <a href="../../index.html" class="empty-btn">
                        <i class="fas fa-arrow-left"></i> Jelajahi PDF
                    </a>
                </div>
            `;
                return;
            }

            subtitle.innerHTML = `Anda memiliki <strong>${favorites.length}</strong> PDF favorit`;

            let html = '<div class="fav-grid">';
            favorites.forEach(fav => {
                const icon = fav.category?.includes('saham') ? '📊' :
                    fav.category?.includes('advanced') ? '📈' :
                        fav.category?.includes('technical') ? '📉' : '📚';
                const cat = fav.category || 'PDF Document';
                html += `
                <div class="fav-card">
                    <div class="fav-icon">${icon}</div>
                    <div class="fav-title">${fav.name}</div>
                    <div class="fav-category">${cat}</div>
                    <div class="fav-actions">
                        <button class="fav-btn fav-btn-view" onclick="viewPDF('${fav.url}')">
                            <i class="fas fa-eye"></i> Lihat
                        </button>
                        <button class="fav-btn fav-btn-remove" onclick="removeFavorite('${fav.url}')" title="Hapus">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            });
            html += '</div>';
            listContainer.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAdminSession();
            renderFavoritesPage();
            fetch('../../footer/favorites.html')
                .then(r => r.text())
                .then(html => document.getElementById('footer-container').innerHTML = html)
                .catch(err => console.log('Footer error:', err));
        });
    </script>
</body>

</html>
