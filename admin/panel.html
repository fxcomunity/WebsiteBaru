<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - FX Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a35;
            --bg-card: #232347;
            --bg-hover: #2d2d5f;
            --text-primary: #ffffff;
            --text-secondary: #a8a8d8;
            --text-muted: #6b6b8f;
            --border: #3a3a5f;
            --shadow: rgba(99, 102, 241, 0.1);
            --shadow-lg: rgba(99, 102, 241, 0.2);
            --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(35, 35, 71, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: clamp(12px, 3vw, 16px) clamp(16px, 4vw, 24px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-title {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 12px);
        }

        .header-title::before {
            content: '\f505';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: clamp(1rem, 3.5vw, 1.25rem);
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 12px);
            padding: clamp(6px, 1.5vw, 8px) clamp(12px, 3vw, 16px);
            background: var(--bg-card);
            border-radius: clamp(10px, 2.5vw, 12px);
            border: 1px solid var(--border);
        }

        .header-logo img {
            width: clamp(28px, 8vw, 36px);
            height: clamp(28px, 8vw, 36px);
            border-radius: clamp(6px, 1.5vw, 8px);
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Panel Root */
        #panelRoot {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: clamp(20px, 5vw, 32px) auto;
            padding: 0 clamp(12px, 3vw, 20px);
        }

        /* Welcome Banner */
        .welcome-banner {
            background: var(--gradient-primary);
            padding: clamp(24px, 5vw, 32px);
            border-radius: clamp(16px, 4vw, 20px);
            margin-bottom: clamp(24px, 5vw, 32px);
            box-shadow: 0 8px 32px var(--shadow-lg);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-banner h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 800;
            color: white;
            margin-bottom: clamp(6px, 1.5vw, 8px);
            line-height: 1.2;
        }

        .welcome-banner p {
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            line-height: 1.5;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
            gap: clamp(16px, 3vw, 20px);
            margin-bottom: clamp(24px, 5vw, 32px);
            animation: fadeInUp 0.6s ease 0.2s backwards;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: clamp(12px, 3vw, 16px);
            padding: clamp(18px, 4vw, 24px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: clamp(120px, 25vw, 140px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: clamp(3px, 0.8vw, 4px);
            background: var(--stat-color, var(--primary));
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--stat-color, var(--primary));
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: clamp(12px, 3vw, 16px);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            font-weight: 600;
            line-height: 1.3;
        }

        .stat-icon {
            width: clamp(36px, 8vw, 40px);
            height: clamp(36px, 8vw, 40px);
            background: var(--stat-color, var(--primary));
            border-radius: clamp(8px, 2vw, 10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: clamp(16px, 3.5vw, 18px);
            flex-shrink: 0;
        }

        .stat-value {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        /* Section */
        .panel-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: clamp(16px, 4vw, 20px);
            padding: clamp(20px, 4vw, 28px);
            margin-bottom: clamp(20px, 4vw, 24px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease 0.4s backwards;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: clamp(18px, 4vw, 24px);
            padding-bottom: clamp(12px, 3vw, 16px);
            border-bottom: 2px solid var(--border);
            gap: clamp(12px, 3vw, 16px);
            flex-wrap: wrap;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 12px);
            line-height: 1.3;
        }

        .section-title i {
            color: var(--primary);
            font-size: clamp(1.1rem, 3vw, 1.25rem);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: clamp(8px, 2vw, 12px);
            flex-wrap: wrap;
        }

        .btn {
            padding: clamp(10px, 2.5vw, 12px) clamp(16px, 3.5vw, 20px);
            border: none;
            border-radius: clamp(8px, 2vw, 10px);
            font-weight: 600;
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vw, 8px);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .btn i {
            font-size: clamp(0.9rem, 2vw, 1rem);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 clamp(6px, 1.5vw, 8px);
            font-size: clamp(0.85rem, 2vw, 0.95rem);
        }

        .data-table thead tr {
            background: var(--bg-secondary);
        }

        .data-table th {
            padding: clamp(10px, 2.5vw, 12px) clamp(12px, 3vw, 16px);
            text-align: left;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .data-table th:first-child {
            border-radius: clamp(8px, 2vw, 10px) 0 0 clamp(8px, 2vw, 10px);
        }

        .data-table th:last-child {
            border-radius: 0 clamp(8px, 2vw, 10px) clamp(8px, 2vw, 10px) 0;
        }

        .data-table tbody tr {
            background: var(--bg-secondary);
            transition: all 0.3s ease;
        }

        .data-table tbody tr:hover {
            background: var(--bg-hover);
            transform: translateX(4px);
        }

        .data-table td {
            padding: clamp(12px, 3vw, 16px);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .data-table td:first-child {
            border-radius: clamp(8px, 2vw, 10px) 0 0 clamp(8px, 2vw, 10px);
        }

        .data-table td:last-child {
            border-radius: 0 clamp(8px, 2vw, 10px) clamp(8px, 2vw, 10px) 0;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: clamp(3px, 1vw, 4px) clamp(8px, 2vw, 12px);
            border-radius: clamp(5px, 1.2vw, 6px);
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .badge-info {
            background: rgba(59, 130, 246, 0.1);
            color: var(--info);
            border: 1px solid var(--info);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: clamp(30px, 6vw, 40px);
            color: var(--text-muted);
        }

        .loading i {
            font-size: clamp(36px, 8vw, 48px);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: clamp(40px, 8vw, 60px) clamp(16px, 4vw, 20px);
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: clamp(48px, 10vw, 64px);
            margin-bottom: clamp(12px, 3vw, 16px);
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: clamp(1.1rem, 3vw, 1.25rem);
            margin-bottom: clamp(6px, 1.5vw, 8px);
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: clamp(0.85rem, 2vw, 0.95rem);
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
            gap: clamp(12px, 3vw, 16px);
            margin-top: clamp(16px, 3vw, 20px);
        }

        .quick-action-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: clamp(10px, 2.5vw, 12px);
            padding: clamp(16px, 4vw, 20px);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: clamp(130px, 28vw, 150px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .quick-action-card:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
            transform: translateY(-4px);
        }

        .quick-action-icon {
            width: clamp(48px, 10vw, 56px);
            height: clamp(48px, 10vw, 56px);
            margin: 0 auto clamp(10px, 2.5vw, 12px);
            background: var(--gradient-primary);
            border-radius: clamp(12px, 3vw, 14px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 4.5vw, 24px);
            color: white;
        }

        .quick-action-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: clamp(3px, 1vw, 4px);
            font-size: clamp(0.9rem, 2.2vw, 1rem);
        }

        .quick-action-desc {
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Table Responsive Wrapper */
        .table-wrapper {
            overflow-x: auto;
            margin: 0 clamp(-20px, -4vw, -28px);
            padding: 0 clamp(20px, 4vw, 28px);
        }

        .table-wrapper::-webkit-scrollbar {
            height: clamp(6px, 1.5vw, 8px);
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr));
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .action-buttons {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .quick-actions {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr));
            }
        }

        @media (max-width: 480px) {
            .header-title::before {
                display: none;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-card {
                min-height: 100px;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .data-table {
                font-size: 0.8rem;
            }

            .data-table th,
            .data-table td {
                padding: 8px 10px;
            }
        }

        /* Landscape Mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .welcome-banner {
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
            }

            .stat-card {
                min-height: 100px;
            }
        }

        /* Large Screens */
        @media (min-width: 1400px) {
            #panelRoot {
                padding: 0 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-title">Admin Panel</div>
        <div class="header-logo">
            <img src="../favicon.ico" alt="FX Community Logo">
        </div>
    </div>

    <!-- Panel Root - Content will be dynamically generated by panel.js -->
    <div id="panelRoot"></div>

    <!-- Scripts -->
    <script src="../data/trading-fx/data.js"></script>
    <script src="../data/saham/data.js"></script>
    <script src="panel.js"></script>
</body>
</html>
