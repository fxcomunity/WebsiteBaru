<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — FX Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../maintenance-check.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #0a0a0f;
            --surface: #12121e;
            --surface-raised: #1c1c2e;
            --surface-high: #232338;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(124,95,255,0.4);
            --accent: #7c5fff;
            --accent-2: #e35fff;
            --accent-3: #5fddff;
            --text: #f0eeff;
            --text-dim: #8886a8;
            --text-muted: #4e4c6a;
            --success: #4fffb0;
            --warning: #ffc94d;
            --danger: #ff5f7e;
            --info: #5fddff;
        }

        html, body { height: 100%; background: var(--ink); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }

        /* ── NAV ── */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px;
            background: rgba(10,10,15,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 0.85rem;
            color: var(--text); text-decoration: none;
        }

        .nav-mark {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }

        .nav-title {
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem;
            color: var(--text-dim);
        }

        .nav-right { display: flex; align-items: center; gap: 12px; }

        .nav-admin {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 14px;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 100px;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s;
        }

        .nav-admin:hover { border-color: var(--border-hover); }

        .nav-admin-avatar {
            width: 26px; height: 26px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: white;
        }

        .nav-admin-name { font-size: 0.82rem; font-weight: 500; color: var(--text-dim); }

        /* Dropdown */
        .dropdown {
            position: absolute; top: calc(100% + 10px); right: 0;
            min-width: 200px;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
            display: none;
            z-index: 300;
            animation: dropIn 0.2s ease;
        }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dropdown.open { display: block; }

        .dropdown-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
            background: none; border: none; width: 100%; text-align: left;
            font-family: 'DM Sans', sans-serif;
        }

        .dropdown-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item.danger:hover { background: rgba(255,95,126,0.08); }

        .dropdown-sep { height: 1px; background: var(--border); margin: 6px 0; }

        /* ── LAYOUT ── */
        .shell {
            display: flex;
            padding-top: 60px;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            position: fixed;
            top: 60px; left: 0; bottom: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-section-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 0 10px;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        .sidebar-section-label:first-child { margin-top: 0; }

        .sb-btn {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            background: none; border: none; width: 100%; text-align: left;
            font-family: 'DM Sans', sans-serif;
            transition: background 0.15s, color 0.15s;
            margin-bottom: 2px;
        }

        .sb-btn i { width: 16px; text-align: center; font-size: 13px; }
        .sb-btn:hover { background: rgba(255,255,255,0.04); color: var(--text); }

        .sb-btn.active {
            background: rgba(124,95,255,0.12);
            color: var(--accent);
            font-weight: 600;
        }

        .sb-btn.active i { color: var(--accent); }

        .sb-btn.danger { color: var(--danger); }
        .sb-btn.danger:hover { background: rgba(255,95,126,0.08); }

        .sidebar-spacer { flex: 1; }

        /* Clock */
        .clock-box {
            margin-top: 12px;
            padding: 14px;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
        }

        .clock-time {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.3rem; font-weight: 800;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .clock-date { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }

        /* ── MAIN ── */
        .main {
            margin-left: 240px;
            flex: 1;
            padding: 28px;
            min-width: 0;
        }

        /* ── WELCOME BANNER ── */
        .banner {
            background: linear-gradient(135deg, rgba(124,95,255,0.15) 0%, rgba(227,95,255,0.08) 100%);
            border: 1px solid rgba(124,95,255,0.2);
            border-radius: 18px;
            padding: 28px 32px;
            margin-bottom: 24px;
            display: flex; align-items: center; justify-content: space-between;
            animation: fadeUp 0.6s ease both;
            position: relative; overflow: hidden;
        }

        .banner::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(124,95,255,0.5), transparent);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .banner-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.3rem; font-weight: 800;
            color: var(--text); margin-bottom: 6px;
        }

        .banner-sub { color: var(--text-dim); font-size: 0.88rem; font-weight: 500; }

        .banner-badge {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px;
            background: rgba(79,255,176,0.08);
            border: 1px solid rgba(79,255,176,0.2);
            border-radius: 100px;
            font-size: 0.8rem; color: var(--success); font-weight: 500;
            white-space: nowrap;
        }

        .online-dot {
            width: 7px; height: 7px; background: var(--success); border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

        /* ── STATS ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
            animation: fadeUp 0.6s ease 0.1s both;
        }

        .stat-card {
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            position: relative; overflow: hidden;
            transition: border-color 0.2s, transform 0.2s;
        }

        .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }

        .stat-card::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: var(--sc);
        }

        .stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

        .stat-icon {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            color: var(--sc);
        }

        .stat-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        .stat-value {
            font-family: 'Unbounded', sans-serif; font-size: 1.75rem; font-weight: 800;
            color: var(--text); line-height: 1;
        }

        /* ── CONTENT CARD ── */
        .card {
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            animation: fadeUp 0.6s ease 0.2s both;
        }

        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            gap: 12px; flex-wrap: wrap;
        }

        .card-title {
            font-family: 'Unbounded', sans-serif; font-size: 0.95rem; font-weight: 700;
            color: var(--text);
            display: flex; align-items: center; gap: 10px;
        }

        .card-title i { color: var(--accent); font-size: 0.9rem; }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 16px;
            border-radius: 9px; border: none;
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white; box-shadow: 0 4px 14px rgba(124,95,255,0.3);
        }

        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,95,255,0.45); }

        .btn-ghost {
            background: var(--surface-high); color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

        .btn-success { background: rgba(79,255,176,0.1); color: var(--success); border: 1px solid rgba(79,255,176,0.25); }
        .btn-success:hover { background: rgba(79,255,176,0.18); }

        .btn-danger { background: rgba(255,95,126,0.1); color: var(--danger); border: 1px solid rgba(255,95,126,0.25); }
        .btn-danger:hover { background: rgba(255,95,126,0.18); }

        .btn-warning { background: rgba(255,201,77,0.1); color: var(--warning); border: 1px solid rgba(255,201,77,0.25); }
        .btn-warning:hover { background: rgba(255,201,77,0.18); }

        .btn-info { background: rgba(95,221,255,0.1); color: var(--info); border: 1px solid rgba(95,221,255,0.25); }
        .btn-info:hover { background: rgba(95,221,255,0.18); }

        /* ── INPUTS ── */
        .field { margin-bottom: 18px; }

        .field label {
            display: block; font-size: 0.78rem; font-weight: 500;
            letter-spacing: 0.05em; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 7px;
        }

        .input {
            width: 100%; padding: 11px 14px;
            background: var(--surface-high);
            border: 1.5px solid var(--border);
            border-radius: 10px; color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,95,255,0.12); }
        .input::placeholder { color: var(--text-muted); }

        select.input { cursor: pointer; }

        /* ── LIST ROWS ── */
        .list-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; margin-bottom: 8px;
            background: var(--surface-high);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s;
            gap: 12px;
        }

        .list-row:hover { border-color: var(--border-hover); transform: translateX(3px); }

        .list-row-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }

        .list-row-emoji { font-size: 22px; flex-shrink: 0; }

        .list-row-name { font-weight: 500; color: var(--text); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .list-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

        /* ── BADGE ── */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 9px; border-radius: 100px;
            font-size: 0.7rem; font-weight: 600;
        }

        .badge-fx { background: rgba(79,255,176,0.1); color: var(--success); border: 1px solid rgba(79,255,176,0.2); }
        .badge-saham { background: rgba(255,201,77,0.1); color: var(--warning); border: 1px solid rgba(255,201,77,0.2); }

        /* ── EMPTY STATE ── */
        .empty {
            text-align: center; padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty i { font-size: 3rem; margin-bottom: 14px; opacity: 0.4; display: block; }
        .empty h3 { font-size: 1rem; color: var(--text-dim); margin-bottom: 6px; }
        .empty p { font-size: 0.85rem; }

        /* ── STATUS BOX ── */
        .status-box {
            padding: 18px 20px; border-radius: 12px;
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 16px;
        }

        .status-box.online { background: rgba(79,255,176,0.07); border: 1px solid rgba(79,255,176,0.2); }
        .status-box.offline { background: rgba(255,95,126,0.07); border: 1px solid rgba(255,95,126,0.2); }

        .status-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }

        .status-icon.online { background: rgba(79,255,176,0.15); color: var(--success); }
        .status-icon.offline { background: rgba(255,95,126,0.15); color: var(--danger); }

        /* ── INFO BOX ── */
        .info-box {
            padding: 14px 16px; border-radius: 10px;
            background: rgba(95,221,255,0.06);
            border: 1px solid rgba(95,221,255,0.15);
            font-size: 0.85rem; color: var(--text-dim);
            display: flex; gap: 10px;
        }

        .info-box i { color: var(--info); flex-shrink: 0; margin-top: 1px; }

        /* Code display */
        .code-display {
            display: flex; align-items: center; gap: 12px;
            padding: 16px; background: var(--surface-high);
            border: 1.5px solid rgba(79,255,176,0.3);
            border-radius: 12px;
        }

        .code-value {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem; font-weight: 800;
            letter-spacing: 6px; color: var(--success); flex: 1; text-align: center;
        }

        /* Grid utils */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .grid-form { display: grid; gap: 16px; max-width: 500px; }

        /* Toast */
        #toast {
            position: fixed; bottom: 28px; right: 28px; z-index: 9999;
            padding: 12px 20px; border-radius: 12px;
            font-size: 0.875rem; font-weight: 500;
            box-shadow: 0 8px 28px rgba(0,0,0,0.4);
            display: none; align-items: center; gap: 10px;
            animation: toastIn 0.3s ease;
            max-width: 320px;
        }

        @keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

        #toast.success { background: rgba(79,255,176,0.12); border:1px solid rgba(79,255,176,0.3); color: var(--success); }
        #toast.error   { background: rgba(255,95,126,0.12); border:1px solid rgba(255,95,126,0.3); color: var(--danger); }
        #toast.info    { background: rgba(124,95,255,0.12); border:1px solid rgba(124,95,255,0.3); color: var(--accent); }
        #toast.show    { display: flex; }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar { width: 200px; }
            .main { margin-left: 200px; }
            .stats { grid-template-columns: repeat(2,1fr); }
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 20px 16px; }
            .stats { grid-template-columns: 1fr 1fr; }
            .banner { flex-direction: column; align-items: flex-start; gap: 14px; }
            .grid-2 { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .stats { grid-template-columns: 1fr; }
        }

        .menu-toggle {
            display: none;
            background: none; border: none;
            color: var(--text-dim); font-size: 18px; cursor: pointer;
            padding: 6px;
        }

        @media (max-width: 768px) { .menu-toggle { display: flex; } }
    </style>
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- NAV -->
<nav class="nav">
    <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <a href="../index.html" class="nav-brand">
            <div class="nav-mark">⚡</div>
            <span>FX<span style="color:var(--accent)">Community</span></span>
        </a>
    </div>
    <span class="nav-title" style="display:none;"><i class="fas fa-shield-halved" style="color:var(--accent);margin-right:6px;"></i>Admin Panel</span>
    <div class="nav-right">
        <div class="nav-admin" id="adminBtn">
            <div class="nav-admin-avatar"><i class="fas fa-user-shield" style="font-size:10px;"></i></div>
            <span class="nav-admin-name" id="adminNameDisplay">Admin</span>
            <i class="fas fa-chevron-down" style="font-size:10px;color:var(--text-muted);"></i>
            <div class="dropdown" id="adminDropdown">
                <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                <a href="../index.html" class="dropdown-item"><i class="fas fa-home"></i> Beranda</a>
                <div class="dropdown-sep"></div>
                <button class="dropdown-item danger" id="logoutDropdown"><i class="fas fa-right-from-bracket"></i> Logout</button>
            </div>
        </div>
    </div>
</nav>

<!-- SHELL -->
<div class="shell">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section-label">Menu Utama</div>
        <button class="sb-btn" data-tab="list"><i class="fas fa-list"></i> Daftar PDF</button>
        <button class="sb-btn" data-tab="add"><i class="fas fa-plus-circle"></i> Tambah PDF</button>
        <button class="sb-btn" data-tab="import"><i class="fas fa-file-import"></i> Import / Export</button>

        <div class="sidebar-section-label">Sistem</div>
        <button class="sb-btn" data-tab="maintenance"><i class="fas fa-tools"></i> Maintenance</button>
        <button class="sb-btn" data-tab="settings"><i class="fas fa-cog"></i> Settings</button>

        <div class="sidebar-spacer"></div>

        <button class="sb-btn danger" id="logoutSidebar"><i class="fas fa-right-from-bracket"></i> Logout</button>

        <!-- Clock -->
        <div class="clock-box">
            <div class="clock-time" id="clockTime">00:00:00</div>
            <div class="clock-date" id="clockDate"></div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="mainArea">
        <!-- Welcome Banner -->
        <div class="banner" id="welcomeBanner">
            <div>
                <div class="banner-title">Admin Dashboard 🛡️</div>
                <div class="banner-sub">Kelola konten dan konfigurasi FX Community</div>
            </div>
            <div class="banner-badge">
                <div class="online-dot"></div>
                Sesi Aktif
            </div>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsGrid"></div>

        <!-- Content Views -->
        <div id="viewList"></div>
        <div id="viewAdd" style="display:none;"></div>
        <div id="viewImport" style="display:none;"></div>
        <div id="viewMaintenance" style="display:none;"></div>
        <div id="viewSettings" style="display:none;"></div>
    </main>
</div>

<script src="../data/trading-fx/data.js"></script>
<script src="../data/saham/data.js"></script>
<script>
(function(){
    // ── AUTH GUARD ──
    if(sessionStorage.getItem('fx_isAdmin') !== '1'){
        alert('Anda harus login sebagai admin.');
        window.location.href = 'index.html';
        return;
    }

    // ── TOAST ──
    function toast(msg, type='info', dur=3000){
        const el = document.getElementById('toast');
        const icons = { success:'fa-circle-check', error:'fa-circle-xmark', info:'fa-circle-info' };
        el.className = `toast show ${type}`;
        el.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i> ${msg}`;
        clearTimeout(el._t);
        el._t = setTimeout(()=>{ el.className='toast'; }, dur);
    }

    // ── DATA ──
    const STORAGE_KEY = 'fx_admin_data_v1';
    function loadData(){
        try{ const r=localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); }catch(e){}
        const fx=(typeof tradingFxData!=='undefined'?tradingFxData.slice():[]);
        const sh=(typeof sahamData!=='undefined'?sahamData.slice():[]);
        return fx.concat(sh);
    }
    function saveData(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
    const data = loadData();

    // ── ADMIN NAME ──
    const adminName = localStorage.getItem('fx_adminName') || 'Admin';
    document.getElementById('adminNameDisplay').textContent = adminName;

    // ── DROPDOWN ──
    const adminBtn = document.getElementById('adminBtn');
    const dropdown = document.getElementById('adminDropdown');
    adminBtn.addEventListener('click', e => { e.stopPropagation(); dropdown.classList.toggle('open'); });
    document.addEventListener('click', () => dropdown.classList.remove('open'));

    // ── MOBILE SIDEBAR ──
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
    document.addEventListener('click', e => {
        if(!sidebar.contains(e.target) && !menuToggle.contains(e.target)) sidebar.classList.remove('open');
    });

    // ── LOGOUT ──
    function doLogout(){
        if(confirm('Yakin ingin logout?')){
            sessionStorage.removeItem('fx_isAdmin');
            window.location.href = 'index.html';
        }
    }
    document.getElementById('logoutSidebar').addEventListener('click', doLogout);
    document.getElementById('logoutDropdown').addEventListener('click', doLogout);

    // ── STATS ──
    function updateStats(){
        const total = data.length;
        const fx    = data.filter(d=>d.category==='trading-fx'||!d.category).length;
        const saham = data.filter(d=>d.category==='saham').length;
        const date  = new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short'});

        const stats = [
            { label:'Total PDF',   value:total,  icon:'fa-file-pdf',  color:'var(--accent)' },
            { label:'Trading FX',  value:fx,     icon:'fa-chart-line', color:'var(--success)' },
            { label:'Saham',       value:saham,  icon:'fa-chart-bar', color:'var(--warning)' },
            { label:'Last Update', value:date,   icon:'fa-calendar',  color:'var(--info)' },
        ];

        document.getElementById('statsGrid').innerHTML = stats.map(s=>`
            <div class="stat-card" style="--sc:${s.color}">
                <div class="stat-top">
                    <div class="stat-label">${s.label}</div>
                    <div class="stat-icon"><i class="fas ${s.icon}"></i></div>
                </div>
                <div class="stat-value" style="font-size:${typeof s.value==='string'?'1.2rem':'1.75rem'}">${s.value}</div>
            </div>
        `).join('');
    }
    updateStats();

    // ── TABS ──
    const views = { list:null, add:null, import:null, maintenance:null, settings:null };
    Object.keys(views).forEach(k=>{ views[k]=document.getElementById('view'+k.charAt(0).toUpperCase()+k.slice(1)); });

    const sbBtns = document.querySelectorAll('.sb-btn[data-tab]');

    function showView(name){
        Object.values(views).forEach(v=>v&&(v.style.display='none'));
        if(views[name]) views[name].style.display='block';
        sbBtns.forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
        if(name==='list') renderList();
        if(name==='add')  renderAdd();
        if(name==='import') renderImport();
        if(name==='maintenance') renderMaintenance();
        if(name==='settings') renderSettings();
        sidebar.classList.remove('open');
    }

    sbBtns.forEach(b=>b.addEventListener('click',()=>showView(b.dataset.tab)));

    // ── URL PARAM ──
    const pg = new URLSearchParams(location.search).get('page');
    showView(pg||'list');

    // ════════════════════════════════
    // RENDER LIST
    // ════════════════════════════════
    function renderList(){
        const v = views.list;
        v.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-list"></i> Daftar PDF</div>
                    <input id="searchInput" class="input" placeholder="Cari PDF..." style="width:220px;">
                </div>
                <div id="listBody"></div>
            </div>
        `;

        const search = document.getElementById('searchInput');
        const body   = document.getElementById('listBody');

        function build(filter=''){
            const items = data.filter(i=>!filter||i.name.toLowerCase().includes(filter.toLowerCase()));
            if(!items.length){
                body.innerHTML = `<div class="empty"><i class="fas fa-search"></i><h3>Tidak ada PDF ditemukan</h3><p>Coba kata kunci lain</p></div>`;
                return;
            }
            body.innerHTML = items.map(pdf=>{
                const idx = data.indexOf(pdf);
                const cat = pdf.category==='saham'?'saham':'fx';
                return `
                    <div class="list-row">
                        <div class="list-row-info">
                            <span class="list-row-emoji">${pdf.thumbnail||'📄'}</span>
                            <div>
                                <div class="list-row-name">${pdf.name}</div>
                                <span class="badge badge-${cat}">${cat==='saham'?'Saham':'Trading FX'}</span>
                            </div>
                        </div>
                        <div class="list-row-actions">
                            <button class="btn btn-ghost" title="Lihat" onclick="window.open('${pdf.url}','_blank')"><i class="fas fa-eye"></i></button>
                            <button class="btn btn-info" title="Edit" onclick="editPdf(${idx})"><i class="fas fa-pen"></i></button>
                            <button class="btn btn-danger" title="Hapus" onclick="deletePdf(${idx})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        search.addEventListener('input', ()=>build(search.value));
        build();
    }

    // ════════════════════════════════
    // RENDER ADD
    // ════════════════════════════════
    function renderAdd(editIdx=null){
        const v = views.add;
        const isEdit = editIdx!==null;
        const pdf = isEdit ? data[editIdx] : {};

        v.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-${isEdit?'pen':'plus-circle'}"></i> ${isEdit?'Edit PDF':'Tambah PDF Baru'}</div>
                </div>
                <div class="grid-form">
                    <div class="field">
                        <label>Nama File</label>
                        <input id="pdfName" class="input" type="text" placeholder="Analisa Teknikal Dasar" value="${pdf.name||''}">
                    </div>
                    <div class="field">
                        <label>URL Google Drive</label>
                        <input id="pdfUrl" class="input" type="url" placeholder="https://drive.google.com/..." value="${pdf.url||''}">
                    </div>
                    <div class="grid-2">
                        <div class="field">
                            <label>Kategori</label>
                            <select id="pdfCategory" class="input">
                                <option value="trading-fx" ${(pdf.category||'trading-fx')==='trading-fx'?'selected':''}>Trading FX</option>
                                <option value="saham" ${pdf.category==='saham'?'selected':''}>Saham</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Emoji Thumbnail</label>
                            <input id="pdfThumb" class="input" type="text" placeholder="📊" maxlength="2" value="${pdf.thumbnail||''}">
                        </div>
                    </div>
                    <div class="grid-2">
                        <button class="btn btn-ghost" id="resetForm"><i class="fas fa-xmark"></i> Reset</button>
                        <button class="btn btn-primary" id="submitForm"><i class="fas fa-save"></i> ${isEdit?'Update':'Simpan'}</button>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('resetForm').addEventListener('click', ()=>renderAdd());
        document.getElementById('submitForm').addEventListener('click', ()=>{
            const name  = document.getElementById('pdfName').value.trim();
            const url   = document.getElementById('pdfUrl').value.trim();
            const cat   = document.getElementById('pdfCategory').value;
            const thumb = document.getElementById('pdfThumb').value.trim();
            if(!name||!url){ toast('Nama & URL wajib diisi!','error'); return; }
            if(isEdit){
                data[editIdx]={name,url,category:cat,thumbnail:thumb};
                toast('PDF berhasil diupdate!','success');
            } else {
                data.unshift({name,url,category:cat,thumbnail:thumb});
                toast('PDF berhasil ditambahkan!','success');
            }
            saveData(data); updateStats(); showView('list');
        });
    }

    // Global edit & delete helpers
    window.editPdf = (idx)=>{ showView('add'); setTimeout(()=>renderAdd(idx),0); };
    window.deletePdf = (idx)=>{
        if(!confirm(`Hapus "${data[idx].name}"?`)) return;
        data.splice(idx,1); saveData(data); updateStats(); renderList();
        toast('PDF dihapus','success');
    };

    // ════════════════════════════════
    // RENDER IMPORT/EXPORT
    // ════════════════════════════════
    function renderImport(){
        views.import.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-file-import"></i> Import / Export</div>
                </div>
                <div style="display:grid;gap:14px;">
                    <div style="padding:18px;background:var(--surface-high);border:1px solid var(--border);border-radius:12px;">
                        <div style="font-weight:600;color:var(--text);margin-bottom:6px;"><i class="fas fa-download" style="color:var(--success);"></i> Export Data</div>
                        <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:14px;">Download semua data PDF dalam format JSON</div>
                        <button class="btn btn-success" id="exportBtn" style="width:100%;justify-content:center;"><i class="fas fa-download"></i> Export JSON</button>
                    </div>
                    <div style="padding:18px;background:var(--surface-high);border:1px solid var(--border);border-radius:12px;">
                        <div style="font-weight:600;color:var(--text);margin-bottom:6px;"><i class="fas fa-upload" style="color:var(--warning);"></i> Import Data</div>
                        <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:14px;">Upload file JSON — data existing akan ditimpa</div>
                        <input type="file" id="importInput" accept="application/json" style="display:none;">
                        <button class="btn btn-warning" id="importBtn" style="width:100%;justify-content:center;"><i class="fas fa-upload"></i> Pilih File JSON</button>
                    </div>
                    <div class="info-box"><i class="fas fa-circle-info"></i><div>Backup data sebelum import. Format harus JSON array. Import akan mengganti semua data existing.</div></div>
                </div>
            </div>
        `;

        document.getElementById('exportBtn').addEventListener('click',()=>{
            const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a'); a.href=url;
            a.download=`fx_admin_data_${new Date().toISOString().split('T')[0]}.json`;
            a.click(); URL.revokeObjectURL(url);
            toast('Export berhasil!','success');
        });

        const importInput = document.getElementById('importInput');
        document.getElementById('importBtn').addEventListener('click',()=>importInput.click());
        importInput.addEventListener('change',e=>{
            const file=e.target.files[0]; if(!file) return;
            const reader=new FileReader();
            reader.onload=()=>{
                try{
                    const parsed=JSON.parse(reader.result);
                    if(!Array.isArray(parsed)) throw new Error('Format harus array');
                    if(confirm(`Import ${parsed.length} items? Data existing akan ditimpa!`)){
                        data.length=0; parsed.forEach(x=>data.push(x));
                        saveData(data); updateStats(); importInput.value='';
                        toast('Import berhasil!','success');
                    }
                }catch(err){ toast('Gagal import: '+err.message,'error'); }
            };
            reader.readAsText(file);
        });
    }

    // ════════════════════════════════
    // RENDER MAINTENANCE
    // ════════════════════════════════
    function renderMaintenance(){
        const cfgKey='fx_maintenance_config';
        function getCfg(){ try{ const r=localStorage.getItem(cfgKey); if(r) return JSON.parse(r); }catch(e){} return {enabled:false,maintenancePage:'maintenance.html'}; }
        function setCfg(o){ localStorage.setItem(cfgKey,JSON.stringify(o)); }

        const cfg=getCfg();

        function getCode(){ try{ const r=localStorage.getItem('fx_temp_access_code'); if(!r) return null; const d=JSON.parse(r); if(Date.now()>d.expiry){ localStorage.removeItem('fx_temp_access_code'); return null; } return d; }catch(e){ return null; } }
        function timeLeft(expiry){ const diff=expiry-Date.now(); if(diff<=0) return 'Expired'; const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000); return h>0?`${h}j ${m}m`:`${m} menit`; }

        const code=getCode();

        views.maintenance.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-tools"></i> Maintenance Mode</div>
                </div>
                <div style="display:grid;gap:14px;">

                    <!-- Status -->
                    <div class="status-box ${cfg.enabled?'offline':'online'}">
                        <div class="status-icon ${cfg.enabled?'offline':'online'}">
                            <i class="fas fa-${cfg.enabled?'exclamation-triangle':'check-circle'}"></i>
                        </div>
                        <div>
                            <div style="font-weight:600;color:var(--text);">Status: ${cfg.enabled?'Maintenance Aktif':'Situs Online'}</div>
                            <div style="font-size:0.82rem;color:var(--text-dim);margin-top:3px;">${cfg.enabled?'Pengguna diarahkan ke halaman maintenance':'Semua pengguna dapat mengakses situs'}</div>
                        </div>
                    </div>

                    <!-- Access Code -->
                    <div style="padding:18px;background:var(--surface-high);border:1px solid var(--border);border-radius:12px;">
                        <div style="font-weight:600;color:var(--text);margin-bottom:6px;"><i class="fas fa-key" style="color:var(--accent);"></i> Kode Akses Sementara</div>
                        <div style="font-size:0.82rem;color:var(--text-dim);margin-bottom:14px;">Kode 6 digit berlaku 24 jam untuk akses sementara</div>
                        ${code?`
                            <div style="margin-bottom:12px;">
                                <div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;">
                                    <span><i class="fas fa-check-circle" style="color:var(--success);"></i> Kode Aktif</span>
                                    <span><i class="fas fa-clock"></i> ${timeLeft(code.expiry)} lagi</span>
                                </div>
                                <div class="code-display">
                                    <div class="code-value" id="codeVal">${code.code}</div>
                                    <button class="btn btn-success" id="copyCode"><i class="fas fa-copy"></i></button>
                                </div>
                            </div>
                        `:`
                            <div style="text-align:center;padding:20px;background:rgba(255,201,77,0.06);border:1px solid rgba(255,201,77,0.15);border-radius:10px;margin-bottom:12px;">
                                <i class="fas fa-key" style="font-size:2rem;color:var(--warning);margin-bottom:8px;display:block;opacity:0.5;"></i>
                                <div style="font-size:0.85rem;color:var(--text-muted);">Belum ada kode aktif</div>
                            </div>
                        `}
                        <div class="grid-2">
                            <button class="btn btn-${code?'warning':'success'}" id="generateCode"><i class="fas fa-sync-alt"></i> ${code?'Generate Ulang':'Generate Kode'}</button>
                            <button class="btn btn-danger" id="revokeCode" ${!code?'disabled':''}><i class="fas fa-times-circle"></i> Hapus Kode</button>
                        </div>
                    </div>

                    <!-- Config -->
                    <div style="padding:18px;background:var(--surface-high);border:1px solid var(--border);border-radius:12px;">
                        <div style="font-weight:600;color:var(--text);margin-bottom:14px;">Konfigurasi</div>
                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:14px;font-size:0.9rem;color:var(--text-dim);">
                            <input type="checkbox" id="mntEnable" ${cfg.enabled?'checked':''} style="width:16px;height:16px;accent-color:var(--accent);">
                            Aktifkan Maintenance Mode
                        </label>
                        <div class="field">
                            <label>Halaman Maintenance</label>
                            <input id="mntPage" class="input" type="text" value="${cfg.maintenancePage||'maintenance.html'}">
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="grid-2">
                        <button class="btn btn-primary" id="saveMnt" style="justify-content:center;"><i class="fas fa-save"></i> Simpan</button>
                        <button class="btn btn-ghost" id="clearMnt" style="justify-content:center;"><i class="fas fa-undo"></i> Reset Default</button>
                    </div>
                    <div class="grid-2">
                        <button class="btn btn-danger" id="activateNow" style="justify-content:center;"><i class="fas fa-power-off"></i> Aktifkan Sekarang</button>
                        <button class="btn btn-success" id="deactivateNow" style="justify-content:center;"><i class="fas fa-check"></i> Nonaktifkan</button>
                    </div>
                </div>
            </div>
        `;

        // Handlers
        const copyBtn = document.getElementById('copyCode');
        if(copyBtn) copyBtn.addEventListener('click',()=>{
            navigator.clipboard.writeText(code.code).then(()=>toast('Kode disalin!','success'));
        });

        document.getElementById('generateCode').addEventListener('click',()=>{
            if(code&&!confirm('Generate ulang? Kode lama tidak berlaku.')) return;
            const c=Math.floor(100000+Math.random()*900000).toString();
            localStorage.setItem('fx_temp_access_code',JSON.stringify({code:c,expiry:Date.now()+86400000,generated:Date.now()}));
            toast(`Kode: ${c} (24 jam)`,'success'); renderMaintenance();
        });

        const revokeBtn = document.getElementById('revokeCode');
        if(revokeBtn) revokeBtn.addEventListener('click',()=>{
            if(!confirm('Hapus kode aktif?')) return;
            localStorage.removeItem('fx_temp_access_code');
            toast('Kode dihapus','success'); renderMaintenance();
        });

        document.getElementById('saveMnt').addEventListener('click',()=>{
            setCfg({enabled:document.getElementById('mntEnable').checked,maintenancePage:document.getElementById('mntPage').value||'maintenance.html'});
            toast('Konfigurasi disimpan!','success'); renderMaintenance();
        });

        document.getElementById('clearMnt').addEventListener('click',()=>{
            if(!confirm('Reset ke default?')) return;
            localStorage.removeItem(cfgKey); toast('Direset!','info'); renderMaintenance();
        });

        document.getElementById('activateNow').addEventListener('click',()=>{
            if(!confirm('Aktifkan maintenance sekarang?')) return;
            const pg=document.getElementById('mntPage').value||'maintenance.html';
            setCfg({enabled:true,maintenancePage:pg});
            sessionStorage.removeItem('maintenanceAccess');
            toast('Maintenance diaktifkan, mengalihkan...','info');
            setTimeout(()=>{ window.location.href='../'+pg; },1000);
        });

        document.getElementById('deactivateNow').addEventListener('click',()=>{
            if(!confirm('Nonaktifkan maintenance?')) return;
            const pg=document.getElementById('mntPage').value||'maintenance.html';
            setCfg({enabled:false,maintenancePage:pg});
            toast('Situs kembali online!','success'); renderMaintenance();
        });
    }

    // ════════════════════════════════
    // RENDER SETTINGS
    // ════════════════════════════════
    function renderSettings(){
        views.settings.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <div class="card-title"><i class="fas fa-cog"></i> Pengaturan Akun</div>
                </div>
                <div class="grid-form">
                    <div class="field">
                        <label>Username Admin</label>
                        <input id="setName" class="input" type="text" value="${localStorage.getItem('fx_adminName')||'Admin'}">
                    </div>
                    <div style="height:1px;background:var(--border);"></div>
                    <div class="field">
                        <label>Password Baru</label>
                        <input id="setPass" class="input" type="password" placeholder="Biarkan kosong jika tidak ingin ganti">
                    </div>
                    <div class="field">
                        <label>Konfirmasi Password</label>
                        <input id="setPassConf" class="input" type="password" placeholder="Ulangi password baru">
                    </div>
                    <button class="btn btn-primary" id="saveSettings" style="justify-content:center;"><i class="fas fa-save"></i> Simpan Perubahan</button>
                </div>
            </div>
        `;

        document.getElementById('saveSettings').addEventListener('click',()=>{
            const name=document.getElementById('setName').value.trim();
            const pass=document.getElementById('setPass').value;
            const conf=document.getElementById('setPassConf').value;
            if(!name||name.length<3){ toast('Username minimal 3 karakter','error'); return; }
            if(pass){
                if(pass.length<6){ toast('Password minimal 6 karakter','error'); return; }
                if(pass!==conf){ toast('Konfirmasi password tidak cocok','error'); return; }
                localStorage.setItem('fx_adminPass',pass);
            }
            localStorage.setItem('fx_adminName',name);
            document.getElementById('adminNameDisplay').textContent=name;
            document.getElementById('setPass').value='';
            document.getElementById('setPassConf').value='';
            toast('Pengaturan berhasil disimpan!','success');
        });
    }

    // ── CLOCK ──
    function tick(){
        const d=new Date();
        document.getElementById('clockTime').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
        document.getElementById('clockDate').textContent=d.toLocaleDateString('id-ID',{weekday:'short',day:'2-digit',month:'short'});
    }
    tick(); setInterval(tick,1000);

})();
</script>
</body>
</html>
