<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #0a0a0f;
            --surface: #12121e;
            --surface-raised: #1c1c2e;
            --surface-high: #232338;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(124,95,255,0.4);
            --accent: #7c5fff;
            --accent-2: #e35fff;
            --text: #f0eeff;
            --text-dim: #8886a8;
            --text-muted: #4e4c6a;
            --success: #4fffb0;
            --danger: #ff5f7e;
        }

        html, body { min-height: 100%; background: var(--ink); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; }

        /* NAV */
        .nav {
            position: fixed; top:0; left:0; right:0; z-index:100;
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px;
            background: rgba(10,10,15,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem;
            color: var(--text); text-decoration: none;
        }

        .nav-mark {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }

        .nav-right { display: flex; align-items: center; gap: 10px; }

        .nav-link {
            display: flex; align-items: center; gap: 7px;
            padding: 7px 14px;
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.82rem; color: var(--text-dim);
            text-decoration: none; transition: all 0.2s;
        }

        .nav-link:hover { color: var(--text); border-color: var(--border-hover); }

        /* LAYOUT */
        .page {
            padding: 88px 24px 48px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* PAGE HEADER */
        .page-header {
            margin-bottom: 28px;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .page-eyebrow {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 4px 12px;
            background: rgba(124,95,255,0.1);
            border: 1px solid rgba(124,95,255,0.2);
            border-radius: 100px;
            font-size: 0.72rem; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 12px;
        }

        .page-title {
            font-family: 'Unbounded', sans-serif; font-size: 1.6rem; font-weight: 900;
            color: var(--text);
        }

        /* CARD */
        .card {
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            animation: fadeUp 0.5s ease both;
        }

        .card:nth-child(2) { animation-delay: 0.05s; }
        .card:nth-child(3) { animation-delay: 0.1s; }

        .card-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 22px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .card-icon {
            width: 36px; height: 36px;
            background: rgba(124,95,255,0.1);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: var(--accent);
        }

        .card-title {
            font-family: 'Unbounded', sans-serif; font-size: 0.9rem; font-weight: 700;
            color: var(--text);
        }

        .card-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 1px; }

        /* FIELD */
        .field { margin-bottom: 18px; }

        .field label {
            display: block; font-size: 0.75rem; font-weight: 500;
            letter-spacing: 0.05em; text-transform: uppercase;
            color: var(--text-muted); margin-bottom: 7px;
        }

        .input {
            width: 100%; padding: 11px 14px;
            background: var(--surface-high);
            border: 1.5px solid var(--border);
            border-radius: 10px; color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,95,255,0.12); }
        .input::placeholder { color: var(--text-muted); }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 11px 18px; border-radius: 10px; border: none;
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.875rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white; box-shadow: 0 4px 14px rgba(124,95,255,0.3); width: 100%; justify-content: center;
        }

        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,95,255,0.45); }

        .btn-ghost {
            background: var(--surface-high); color: var(--text-dim);
            border: 1px solid var(--border); width: 100%; justify-content: center;
        }

        .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

        .btn-danger-outline {
            background: rgba(255,95,126,0.08); color: var(--danger);
            border: 1px solid rgba(255,95,126,0.25); width: 100%; justify-content: center;
        }

        .btn-danger-outline:hover { background: rgba(255,95,126,0.15); }

        .sep { height: 1px; background: var(--border); margin: 18px 0; }

        /* TOAST */
        #toast {
            position: fixed; bottom: 28px; right: 28px; z-index: 9999;
            padding: 12px 20px; border-radius: 12px;
            font-size: 0.875rem; font-weight: 500;
            box-shadow: 0 8px 28px rgba(0,0,0,0.4);
            display: none; align-items: center; gap: 10px;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

        #toast.success { display:flex; background: rgba(79,255,176,0.12); border:1px solid rgba(79,255,176,0.3); color: var(--success); }
        #toast.error   { display:flex; background: rgba(255,95,126,0.12); border:1px solid rgba(255,95,126,0.3); color: var(--danger); }
    </style>
</head>
<body>

<div id="toast"></div>

<!-- NAV -->
<nav class="nav">
    <a href="../index.html" class="nav-brand">
        <div class="nav-mark">⚡</div>
        FX<span style="color:var(--accent)">Community</span>
    </a>
    <div class="nav-right">
        <a href="panel.html" class="nav-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>
</nav>

<!-- PAGE -->
<div class="page">

    <div class="page-header">
        <div class="page-eyebrow"><i class="fas fa-cog" style="font-size:9px;"></i> Admin Settings</div>
        <div class="page-title">Pengaturan Akun</div>
    </div>

    <!-- Account Card -->
    <div class="card">
        <div class="card-header">
            <div class="card-icon"><i class="fas fa-user-pen"></i></div>
            <div>
                <div class="card-title">Informasi Akun</div>
                <div class="card-sub">Ubah username dan password admin</div>
            </div>
        </div>

        <div class="field">
            <label>Username Admin</label>
            <input id="adminName" class="input" type="text" placeholder="Username baru">
        </div>

        <div class="sep"></div>

        <div class="field">
            <label>Password Baru</label>
            <input id="adminPass" class="input" type="password" placeholder="Biarkan kosong jika tidak ingin mengubah">
        </div>

        <div class="field">
            <label>Konfirmasi Password</label>
            <input id="confirmPass" class="input" type="password" placeholder="Ulangi password baru">
        </div>

        <button class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> Simpan Perubahan</button>
    </div>

    <!-- Danger Zone -->
    <div class="card">
        <div class="card-header">
            <div class="card-icon" style="background:rgba(255,95,126,0.1);color:var(--danger);"><i class="fas fa-triangle-exclamation"></i></div>
            <div>
                <div class="card-title">Zona Bahaya</div>
                <div class="card-sub">Tindakan ini tidak dapat dibatalkan</div>
            </div>
        </div>
        <p style="font-size:0.85rem;color:var(--text-dim);margin-bottom:16px;">Keluar dari sesi admin akan mengarahkan Anda kembali ke halaman login.</p>
        <button class="btn btn-danger-outline" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Keluar Sesi</button>
    </div>

</div>

<script>
    // Auth guard
    if(sessionStorage.getItem('fx_isAdmin') !== '1'){
        window.location.href = 'index.html';
    }

    const ADMIN_DEFAULT_USER = 'admin';

    // Toast helper
    function toast(msg, type='success'){
        const el = document.getElementById('toast');
        el.className = type;
        el.innerHTML = `<i class="fas fa-${type==='success'?'circle-check':'circle-xmark'}"></i> ${msg}`;
        clearTimeout(el._t);
        el._t = setTimeout(()=>{ el.className=''; }, 4000);
    }

    // Populate current username
    document.getElementById('adminName').value = localStorage.getItem('fx_adminName') || ADMIN_DEFAULT_USER;

    // Save
    document.getElementById('saveBtn').addEventListener('click', ()=>{
        const name     = document.getElementById('adminName').value.trim();
        const pass     = document.getElementById('adminPass').value;
        const confirm  = document.getElementById('confirmPass').value;

        if(name.length < 3){ toast('Username minimal 3 karakter', 'error'); return; }

        if(pass){
            if(pass.length < 6){ toast('Password minimal 6 karakter', 'error'); return; }
            if(pass !== confirm){ toast('Konfirmasi password tidak cocok', 'error'); return; }
            localStorage.setItem('fx_adminPass', pass);
        }

        localStorage.setItem('fx_adminName', name);
        document.getElementById('adminPass').value = '';
        document.getElementById('confirmPass').value = '';
        toast('Pengaturan berhasil disimpan!');
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', ()=>{
        if(confirm('Yakin ingin keluar dari sesi admin?')){
            sessionStorage.removeItem('fx_isAdmin');
            window.location.href = 'index.html';
        }
    });
</script>
</body>
</html>
